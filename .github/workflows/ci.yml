name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tools build and vet
        run: go vet ./...
      - name: Validate data and check reports are up to date
        run: python3 scripts/tracker.py check
      - name: Build tracker.db
        run: python3 scripts/tracker.py build -o tracker.db
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-db
          path: tracker.db
