name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tools build, vet and test
        run: go vet ./... && go test ./...
      - name: Validate data and check reports are up to date
        run: python3 scripts/tracker.py check
      - name: Build tracker.db
        run: python3 scripts/tracker.py build -o tracker.db
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-db
          path: tracker.db
  govec:
    # Builds govec against TiDB v8.5.8 (module proxy, no local checkout) with
    # the toolchain pinned in govec/go.mod and checks that the committed
    # vectors are byte-identical to a fresh run. The committed files are
    # generated on darwin/arm64; this linux/amd64 run reproducing them (header
    # goos/goarch excluded) is the cross-platform determinism check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: govec/go.mod
          cache-dependency-path: govec/go.sum
      - name: govec vet and test (header, coverage, oracle, determinism)
        working-directory: govec
        run: go vet ./... && go test ./...
      - name: Committed vectors are up to date
        run: scripts/govec.sh --check
