name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tools build, vet and test
        run: go vet ./... && go test ./...
      - name: Validate data and check reports are up to date
        run: python3 scripts/tracker.py check
      - name: Build tracker.db
        run: python3 scripts/tracker.py build -o tracker.db
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-db
          path: tracker.db
  govec:
    # Builds govec against TiDB v8.5.8 (module proxy, no local checkout) with
    # the toolchain pinned in govec/go.mod and checks that the committed
    # vectors of the runner's target are byte-identical to a fresh run (header
    # goos excluded). Vectors depend on the target (gc fuses float multiply-add
    # into FMA on arm64, not on amd64 GOAMD64=v1; govec/README.md "Targets"),
    # so each committed target is checked on its own architecture.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm] # amd64 (GOAMD64=v1), arm64
    runs-on: ${{ matrix.runner }}
    env:
      GOAMD64: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: govec/go.mod
          cache-dependency-path: govec/go.sum
      # Upstream fixes applied to the linked TiDB code (govec/fixes/README.md):
      # every later go command uses the patched TiDB module.
      - name: govec modfile (upstream fixes)
        run: |
          flags=$(scripts/govec-fixes.sh)
          echo "GOFLAGS=$flags" >> "$GITHUB_ENV"
      - name: govec vet and test (header, coverage, oracle, determinism, FMA model)
        working-directory: govec
        run: go vet ./... && go test ./...
      - name: Committed vectors of this target are up to date
        run: scripts/govec.sh --check
      # A new domain's file for a target the author cannot run (e.g. amd64 from an
      # arm64 Mac without an amd64 runtime) is taken from this artifact: Go ran on
      # the runner's target. govec/README.md "Regenerating".
      - name: Fresh vectors of this target (artifact)
        if: always()
        run: |
          (cd govec && go build -o ../bin/govec .)
          mkdir -p out/$(bin/govec target)
          for d in $(bin/govec list); do bin/govec "$d" -o "out/$(bin/govec "$d" --filename)"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govec-vectors-${{ matrix.runner }}
          path: out/
      # Generator robustness: other seeds of the script domains must generate without a
      # crash (output not committed). The files are kept as an artifact; replay them in
      # tidb-rs with GOVEC_CHUNK_FILES=a.jsonl.gz,b.jsonl.gz cargo test -p tidb-chunk
      # --test govec_chunk (govec/README.md "Extra seeds").
      - name: Extra seeds generate (chunk)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec chunk -seed "$s" -o "seeds/chunk-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (codec)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec codec -seed "$s" -o "seeds/codec-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (tablecodec)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec tablecodec -seed "$s" -o "seeds/tablecodec-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (cgroup)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec cgroup -seed "$s" -o "seeds/cgroup-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (sessionvars)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 81 82 83 84; do bin/govec sessionvars -seed "$s" -o "seeds/sessionvars-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (stmtctx)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec stmtctx -seed "$s" -o "seeds/stmtctx-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (ranger)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec ranger -seed "$s" -o "seeds/ranger-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (exprctx)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec exprctx -seed "$s" -o "seeds/exprctx-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (expr)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec expr -seed "$s" -o "seeds/expr-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (ctx2b)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec ctx2b -seed "$s" -o "seeds/ctx2b-seed$s.jsonl.gz"; done
      - name: Extra seeds generate (execdetails)
        run: |
          mkdir -p seeds
          for s in 1 2 3 4 5 6 7 8; do bin/govec execdetails -seed "$s" -o "seeds/execdetails-seed$s.jsonl.gz"; done
      - uses: actions/upload-artifact@v4
        with:
          name: govec-extra-seeds-${{ matrix.runner }}
          path: seeds/
      - name: FMA site registry is up to date (cross-compiles every target)
        if: matrix.runner == 'ubuntu-latest'
        run: scripts/go_fma_sites.py --check
